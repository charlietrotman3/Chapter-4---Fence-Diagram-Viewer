<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interactive Fence Diagram Viewer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 900px;
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 36px;
            font-weight: 600;
        }

        .subtitle {
            margin-bottom: 45px;
            color: #666;
            font-size: 17px;
        }

        .plots {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .plot-card {
            background: white;
            border-radius: 12px;
            padding: 35px 25px;
            text-decoration: none;
            color: #222;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            transition: transform 0.2s ease,
                        box-shadow 0.2s ease;
        }

        .plot-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .plot-card h2 {
            margin: 0 0 12px 0;
            font-size: 28px;
        }

        .plot-card p {
            margin: 0;
            color: #666;
            font-size: 15px;
            line-height: 1.5;
        }

        .footer {
            margin-top: 45px;
            color: #888;
            font-size: 13px;
        }

        @media (max-width: 650px) {

            .plots {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Interactive Fence Diagram Viewer</h1>

        <div class="subtitle">
            Select a fence diagram to view the interactive 3D model.
        </div>

        <div class="plots">

            <a class="plot-card" href="SICD_interactive.html">
                <h2>SICD</h2>
                <p>
                    Open the interactive SICD fence diagram
                </p>
            </a>

            <a class="plot-card" href="SOCD_interactive.html">
                <h2>SOCD</h2>
                <p>
                    Open the interactive SOCD fence diagram
                </p>
            </a>

        </div>

        <div class="footer">
            Interactive 3D fence diagrams
        </div>

    </div>

</body>
</html>
